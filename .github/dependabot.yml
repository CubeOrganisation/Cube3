version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    target-branch: "dev"
    groups:
      dependances-python:
        patterns: ["*"]
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    target-branch: "dev"
    groups:
      actions-github:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
      include: "scope"
